# 本地开发基础设施:PostgreSQL(pgvector) + RabbitMQ + MinIO
# 启动: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bidox-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bidox_ai
    ports:
      # 宿主端口与 .env 的 DATABASE_URL(5433) 以及后端 bidox-service 的 local profile 对齐
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: bidox-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: bidox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  rabbitdata:
  miniodata:
